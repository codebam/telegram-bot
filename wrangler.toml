name = "tux-robot"
main = "src/index.ts"
compatibility_flags = [ "nodejs_compat" ]
compatibility_date = "2025-06-04"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "CONVERSATION_HISTORY"
id = "7c147881ce7d42b8811bfbf8c38e3ee4"

[[r2_buckets]]
binding = "R2"
bucket_name = "share"

[[workflows]]
binding = "AI_WORKFLOW"
name = "ai-workflow"
class_name = "AIWorkflow"

[env.dev]
name = "tux-robot-dev"

[env.dev.ai]
binding = "AI"

[[env.dev.kv_namespaces]]
binding = "CONVERSATION_HISTORY"
id = "7c147881ce7d42b8811bfbf8c38e3ee4"

[[env.dev.r2_buckets]]
binding = "R2"
bucket_name = "share"

[[env.dev.workflows]]
binding = "AI_WORKFLOW"
name = "ai-workflow-dev"
class_name = "AIWorkflow"
